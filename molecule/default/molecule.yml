---
# role: nfs
# file: molecule/default/molecule.yml

dependency:
  name: "galaxy"
  options:
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
    role-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      allow_world_readable_tmpfiles: true
      callbacks_enabled: "ansible.builtin.default"
      callback_result_format: "yaml"
      remote_tmp: "/tmp/.ansible/tmp"
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    prepare: "../resources/playbooks/prepare.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
  connection_options:
    ansible_user: "molecule"
  inventory:
    group_vars:
      all:
        nfs_realm: "NFS.TEST"
        nfs_host_fqdn: "{{ inventory_hostname }}.nfs.test"
        __nfs_test_admin_password: "Molecule-Only-Adm1n!"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "converge"
    - "idempotence"
    - "check"
    - "verify"
    - "side_effect"
    - "converge"
    - "idempotence"
    - "verify"
    - "destroy"
  name: "default"
platforms:
  - name: "nfs-dc"
    hostname: "nfs-dc.nfs.test"
    image: "docker.io/jomrr/molecule-debian:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    network: "nfs-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "nfs_test_dc"
  - name: "nfs-member"
    hostname: "nfs-member.nfs.test"
    image: "docker.io/jomrr/molecule-${img:-fedora}:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    privileged: true
    network: "nfs-${MOLECULE_SCENARIO_NAME}"
    groups:
      - "nfs_test_servers"
