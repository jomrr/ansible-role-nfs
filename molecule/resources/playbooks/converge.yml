---
# role: nfs
# file: molecule/resources/playbooks/converge.yml

- name: NFS | Register Kerberos credentials
  hosts: nfs_test_servers
  gather_facts: false
  vars_files:
    - ../../../vars/main.yml
  tasks:

    - name: NFS | Register the server identity
      ansible.builtin.import_tasks: ../../../tasks/kerberos.yml

  handlers:

    - name: NFS | Report service notification
      ansible.builtin.debug:
        msg: NFS credentials changed; service activation is outside this test.
      listen:
        - reload server credentials
        - restart client authentication
