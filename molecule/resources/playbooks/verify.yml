---
# role: nfs
# file: molecule/resources/playbooks/verify.yml

- name: NFS | Verify Kerberos credentials
  hosts: nfs_test_servers
  gather_facts: false
  environment:
    KRB5CCNAME: FILE:/tmp/nfs-molecule.ccache
  tasks:

    - name: NFS | Verify the existing Samba machine trust
      become: true
      become_user: root
      ansible.builtin.command:
        argv: [net, ads, testjoin, --machine-pass, --use-kerberos=required]
      changed_when: false

    - name: NFS | Obtain a fresh machine ticket
      become: true
      become_user: root
      ansible.builtin.command:
        argv: [kinit, -k, -t, /etc/krb5.keytab, '{{ inventory_hostname | upper }}$@{{ nfs_realm }}']
      changed_when: true

    - name: NFS | Decrypt the NFS service ticket with the registered key
      become: true
      become_user: root
      ansible.builtin.command:
        argv: [kvno, -k, /etc/krb5.keytab, 'nfs/{{ nfs_host_fqdn }}@{{ nfs_realm }}']
      changed_when: false
