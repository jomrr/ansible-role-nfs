---
# role: nfs
# file: molecule/resources/playbooks/side_effect.yml

- name: NFS | Remove the NFS identity before reconverging
  hosts: nfs_test_servers
  gather_facts: false
  tasks:

    - name: NFS | Remove the NFS identity while retaining machine credentials
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - adcli
          - update
          - --host-keytab=/etc/krb5.keytab
          - '--host-fqdn={{ nfs_host_fqdn }}'
          - '--remove-service-principal=nfs/{{ nfs_host_fqdn }}'
          - --add-samba-data
      changed_when: true
      no_log: true
